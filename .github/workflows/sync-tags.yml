name: Sync Upstream Tags
on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 */6 * * *'

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false # 关闭自动注入凭证，避免冲突

      - name: Sync upstream tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ========== 修改这里为【原仓库】owner/repo ==========
          UPSTREAM_REPO="infiniflow/ragflow"
          # ==================================================

          git config --global user.name "github‑actions[bot]"
          git config --global user.email "github‑actions[bot]@users.noreply.github.com"

          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream --tags

          # 设置 origin 使用token认证，推送到你自己fork仓库
          git remote set-url origin "https://${{ github.actor }}:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin --tags
